<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>MorganaBot dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
<header class="top">
    <div class="brand">MorganaBot</div>
    <div id="server-picker" class="server-picker"></div>
    <div id="account" class="account"></div>
</header>
<div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Super admin" hidden></aside>
    <div class="main-column">
        <nav id="nav" class="tabs" aria-label="Pages"></nav>
        <div id="banner" class="notice" role="alert" hidden></div>
        <main id="content">
            <p class="loading">Loading…</p>
        </main>
    </div>
</div>
<noscript><p class="notice error">The dashboard needs JavaScript.</p></noscript>
</body>
</html>
